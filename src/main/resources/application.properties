spring.application.name=hr_management

# ==========================================
# CẤU HÌNH KẾT NỐI MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_hr_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================
# update: tự cập nhật schema | create: tạo lại mỗi lần | validate: chỉ kiểm tra
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# CẤU HÌNH SERVER
# ==========================================
server.port=8082

# ==========================================
# TẠM THỜI - Dev mode (sẽ config JWT sau)
# ==========================================
spring.security.user.name=admin
spring.security.user.password=admin123
