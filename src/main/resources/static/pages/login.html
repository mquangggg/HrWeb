<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập – HR Management</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Font chữ cho toàn trang */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Card chứa form đăng nhập */
        .auth-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* Logo hình vuông góc bo tròn */
        .logo-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin: 0 auto 12px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.5);
        }

        /* Tab pill khi active */
        .nav-pills .nav-link.active {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }
        .nav-pills .nav-link {
            color: #6c757d;
            font-weight: 500;
        }

        /* Nút submit chính */
        .btn-submit {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
            padding: 11px;
            font-weight: 600;
            border-radius: 10px;
            width: 100%;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.88;
            color: white;
        }

        /* Input focus màu tím */
        .form-control:focus,
        .input-group-text {
            border-color: #a5b4fc;
            box-shadow: none;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <!-- Logo & Tên hệ thống -->
            <div class="text-center mb-4">
                <div class="logo-box">
                    <i class="fas fa-users-gear"></i>
                </div>
                <h4 class="text-white fw-bold mb-1">HR Management</h4>
                <small class="text-white-50">Hệ thống quản lý nhân sự toàn diện</small>
            </div>

            <!-- Card chính -->
            <div class="card auth-card p-4">

                <!-- Tab: Đăng nhập | Đăng ký -->
                <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" id="btn-show-login"
                           onclick="showPanel('login'); return false;">
                            <i class="fas fa-sign-in-alt me-1"></i> Đăng nhập
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="btn-show-register"
                           onclick="showPanel('register'); return false;">
                            <i class="fas fa-user-plus me-1"></i> Đăng ký
                        </a>
                    </li>
                </ul>

                <!-- ========== PANEL ĐĂNG NHẬP ========== -->
                <div id="panel-login">
                    <h5 class="fw-bold mb-1">Chào mừng trở lại 👋</h5>
                    <p class="text-muted small mb-3">Đăng nhập để tiếp tục quản lý nhân sự</p>

                    <!-- Thông báo lỗi -->
                    <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="login-form">
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="login-email" class="form-label fw-medium">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-envelope text-muted"></i>
                                </span>
                                <input type="email" class="form-control" id="login-email"
                                       placeholder="example@company.com" required>
                            </div>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="login-password" class="form-label fw-medium">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>
                                <input type="password" class="form-control" id="login-password"
                                       placeholder="Nhập mật khẩu" required>
                                <!-- Nút hiện/ẩn mật khẩu -->
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePw('login-password', this)">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Ghi nhớ + Quên mật khẩu -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember-me">
                                <label class="form-check-label small" for="remember-me">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>
                            <a href="#" class="small text-decoration-none" style="color:#4f46e5">
                                Quên mật khẩu?
                            </a>
                        </div>

                        <button type="submit" class="btn btn-submit mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i> Đăng nhập
                        </button>
                        
                        <div class="text-center mb-3">
                            <span class="text-muted small">Hoặc</span>
                        </div>
                        
                        <a href="/oauth2/authorization/google" class="btn btn-outline-dark w-100" style="border-radius: 10px;">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="width: 20px; height: 20px; margin-right: 8px;">
                            Đăng nhập bằng Google
                        </a>
                    </form>
                </div>

                <!-- ========== PANEL ĐĂNG KÝ ========== -->
                <div id="panel-register" class="d-none">
                    <h5 class="fw-bold mb-1">Tạo tài khoản mới ✨</h5>
                    <p class="text-muted small mb-3">Điền thông tin để đăng ký vào hệ thống</p>

                    <!-- Thông báo -->
                    <div id="register-alert" class="alert d-none" role="alert"></div>

                    <form id="register-form">
                        <!-- Họ & Tên (2 cột) -->
                        <div class="row g-2 mb-3">
                            <div class="col">
                                <label class="form-label fw-medium">Họ</label>
                                <input type="text" class="form-control" id="reg-lastname"
                                       placeholder="Nguyễn" required>
                            </div>
                            <div class="col">
                                <label class="form-label fw-medium">Tên</label>
                                <input type="text" class="form-control" id="reg-firstname"
                                       placeholder="Văn A" required>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-envelope text-muted"></i>
                                </span>
                                <input type="email" class="form-control" id="reg-email"
                                       placeholder="example@company.com" required>
                            </div>
                        </div>

                        <!-- Số điện thoại -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">Số điện thoại</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-phone text-muted"></i>
                                </span>
                                <input type="tel" class="form-control" id="reg-phone"
                                       placeholder="0901 234 567">
                            </div>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>
                                <input type="password" class="form-control" id="reg-password"
                                       placeholder="Tối thiểu 8 ký tự" required>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePw('reg-password', this)">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">Xác nhận mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>
                                <input type="password" class="form-control" id="reg-confirm"
                                       placeholder="Nhập lại mật khẩu" required>
                                <button type="button" class="btn btn-outline-secondary"
                                        onclick="togglePw('reg-confirm', this)">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Điều khoản -->
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label small" for="terms">
                                Tôi đồng ý với
                                <a href="#" style="color:#4f46e5">Điều khoản dịch vụ</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-submit">
                            <i class="fas fa-user-plus me-2"></i> Đăng ký ngay
                        </button>
                    </form>
                </div>

            </div><!-- /card -->
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    // ===== CHUYỂN GIỮA PANEL ĐĂNG NHẬP / ĐĂNG KÝ =====
    function showPanel(panel) {
        // Ẩn tất cả panel
        $('#panel-login, #panel-register').addClass('d-none');
        // Hiện panel được chọn
        $('#panel-' + panel).removeClass('d-none');
        // Cập nhật tab active
        $('#authTabs .nav-link').removeClass('active');
        $('#btn-show-' + panel).addClass('active');
    }

    // ===== HIỆN / ẨN MẬT KHẨU =====
    function togglePw(inputId, btn) {
        const $input = $('#' + inputId);
        const $icon  = $(btn).find('i');

        if ($input.attr('type') === 'password') {
            // Đổi sang text để thấy mật khẩu
            $input.attr('type', 'text');
            $icon.removeClass('fa-eye').addClass('fa-eye-slash');
        } else {
            // Đổi lại sang password để ẩn
            $input.attr('type', 'password');
            $icon.removeClass('fa-eye-slash').addClass('fa-eye');
        }
    }

    // ===== XỬ LÝ ĐĂNG NHẬP =====
    $('#login-form').on('submit', function(e) {
        e.preventDefault(); // Ngăn form reload trang

        $.ajax({
            url: '/api/v1/auth/login',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                email:    $('#login-email').val(),
                password: $('#login-password').val()
            }),
            success: function(data) {
                // Lưu token vào localStorage để dùng cho các request sau
                localStorage.setItem('token', data.token);
                localStorage.setItem('user',  JSON.stringify(data.user));
                // Chuyển sang trang dashboard
                window.location.href = '/pages/dashboard.html';
            },
            error: function(xhr) {
                const msg = xhr.responseJSON?.message || 'Email hoặc mật khẩu không đúng!';
                $('#login-alert').removeClass('d-none').text(msg);
            }
        });
    });

    // ===== XỬ LÝ ĐĂNG KÝ =====
    $('#register-form').on('submit', function(e) {
        e.preventDefault();

        // Kiểm tra 2 mật khẩu có khớp không
        if ($('#reg-password').val() !== $('#reg-confirm').val()) {
            showRegAlert('danger', 'Mật khẩu xác nhận không khớp!');
            return;
        }

        $.ajax({
            url: '/api/v1/auth/register',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                lastName:  $('#reg-lastname').val(),
                firstName: $('#reg-firstname').val(),
                email:     $('#reg-email').val(),
                phone:     $('#reg-phone').val(),
                password:  $('#reg-password').val()
            }),
            success: function() {
                showRegAlert('success', 'Đăng ký thành công! Đang chuyển đến trang đăng nhập...');
                setTimeout(function() { showPanel('login'); }, 2000);
            },
            error: function(xhr) {
                const msg = xhr.responseJSON?.message || 'Đăng ký thất bại!';
                showRegAlert('danger', msg);
            }
        });
    });

    // Hàm hiện thông báo ở form Đăng ký
    function showRegAlert(type, msg) {
        $('#register-alert')
            .removeClass('d-none alert-success alert-danger')
            .addClass('alert-' + type)
            .text(msg);
    }
</script>

</body>
</html>
